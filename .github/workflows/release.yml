# Builds the Windows installer on GitHub's Windows machines whenever main changes, and publishes it as a release
# tagged v<VERSION> (from src/RangeCalculator.pyw) if that release doesn't exist yet. Bump VERSION to ship an update.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install pytest pyinstaller
      - name: Install Inno Setup if missing
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: RangeCalculator
          path: dist/*.exe
      - name: Publish release if this version is new
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = (Select-String -Path src/RangeCalculator.pyw -Pattern 'RANGECALC_VERSION", "([\d.]+)"').Matches[0].Groups[1].Value
          gh release view "v$ver" *> $null
          if ($LASTEXITCODE -eq 0) { "v$ver already released"; exit 0 }
          gh release create "v$ver" dist/RangeCalculator-Setup.exe --title "Range Calculator $ver" --generate-notes --target $env:GITHUB_SHA
