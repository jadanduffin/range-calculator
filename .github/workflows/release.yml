# Builds the Windows installer on GitHub's Windows machines whenever main changes, and publishes it as a release
# tagged v<VERSION> (from src/RangeCalculator.pyw) if that release doesn't exist yet. Bump VERSION to ship an update.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install pytest pyinstaller
      - name: Install Inno Setup if missing
        shell: pwsh
        run: if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: RangeCalculator
          path: dist/*.exe
      - name: Publish release if this version is new
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = (Select-String -Path src/RangeCalculator.pyw -Pattern 'RANGECALC_VERSION", "([\d.]+)"').Matches[0].Groups[1].Value
          # GitHub's release API sometimes answers 502; try a few times, finishing a half-made release if one was left behind
          foreach ($try in 1..5) {
            $rel = gh release view "v$ver" --json assets,isDraft 2>$null | ConvertFrom-Json
            if ($rel -and ($rel.assets.name -contains "RangeCalculator-Setup.exe") -and -not $rel.isDraft) { "v$ver released"; exit 0 }
            if (-not $rel) {
              gh release create "v$ver" dist/RangeCalculator-Setup.exe --title "Range Calculator $ver" --notes "Download RangeCalculator-Setup.exe below." --target $env:GITHUB_SHA
            } else {
              gh release upload "v$ver" dist/RangeCalculator-Setup.exe --clobber
              gh release edit "v$ver" --draft=false
            }
            "attempt $try did not finish; waiting"
            Start-Sleep -Seconds (15 * $try)
          }
          $rel = gh release view "v$ver" --json assets,isDraft 2>$null | ConvertFrom-Json
          if ($rel -and ($rel.assets.name -contains "RangeCalculator-Setup.exe") -and -not $rel.isDraft) { "v$ver released"; exit 0 }
          exit 1
