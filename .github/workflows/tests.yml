# Continuous Integration: GitHub runs your tests on a fresh machine
# every time you push. A green check or red X appears next to each commit.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run pytest -v
